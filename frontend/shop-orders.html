<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Orders - WrapIt</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        .order-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .status-select { padding: 5px; margin-top: 10px; }
        .btn-update { padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;}
    </style>
</head>
<body>

    <h1>Manage Shop Orders</h1>
    <div id="orders-container">Loading orders...</div>

    <script>
        // Use your live Render backend URL
        const API_URL = 'https://wrapit-backend-salar.onrender.com/api';

        async function fetchShopOrders() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please log in as a shop owner');
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/shop-orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                const container = document.getElementById('orders-container');

                if (data.success && data.orders.length > 0) {
                    container.innerHTML = ''; // Clear loading text
                    
                    data.orders.forEach(order => {
                        // Check if customer exists to prevent errors
                        const customerName = order.customer ? order.customer.name : 'Unknown Customer';
                        const customerPhone = order.customer ? order.customer.phone : 'N/A';

                        const orderEl = document.createElement('div');
                        orderEl.className = 'order-card';
                        orderEl.innerHTML = `
                            <h3>Order ID: ${order._id}</h3>
                            <p><strong>Customer:</strong> ${customerName} (${customerPhone})</p>
                            <p><strong>Total Price:</strong> $${order.totalPrice}</p>
                            <p><strong>Current Status:</strong> ${order.status}</p>
                            
                            <label>Update Status:</label>
                            <select class="status-select" id="status-${order._id}">
                                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Confirmed" ${order.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="In Progress" ${order.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                            <button class="btn-update" onclick="updateStatus('${order._id}')">Update</button>
                        `;
                        container.appendChild(orderEl);
                    });
                } else {
                    container.innerHTML = '<p>No orders found for your shop yet.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('orders-container').innerHTML = '<p>Error loading orders.</p>';
            }
        }

        async function updateStatus(orderId) {
            const token = localStorage.getItem('token');
            const newStatus = document.getElementById(`status-${orderId}`).value;

            try {
                const response = await fetch(`${API_URL}/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await response.json();
                if (data.success) {
                    alert('Order status updated successfully!');
                    fetchShopOrders(); // Refresh the list
                } else {
                    alert(data.message || 'Failed to update status');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error updating order');
            }
        }

        // Load orders when the page opens
        fetchShopOrders();
    </script>
</body>
</html>
