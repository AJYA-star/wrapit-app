</head>
<body>
    <div class="container">
        <h1>🎁 WrapIt</h1>
        <p>Find the perfect gift wrapping service near you</p>
        <button class="btn" onclick="window.location.href='shops.html'">Browse Shops</button>
        <button class="btn btn-outline" onclick="window.location.href='login.html'">Login</button>
        <button class="btn btn-outline" onclick="window.location.href='my-orders.html'">My Orders</button>
        <button class="btn install-btn" id="installBtn">📱 Install App</button>
        <p class="features">✨ Discover local gift wrapping shops<br>💰 Compare prices & services<br>📅 Book appointments instantly</p>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker error:', err));
        }
    </script>
</body>
</html>
