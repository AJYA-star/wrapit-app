<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Register - WrapIt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
      color: #7b2cbf;
    }

    .subtitle {
      margin-bottom: 25px;
      text-align: center;
      color: #666;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #7b2cbf;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #7b2cbf;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5a189a;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      line-height: 1.4;
    }

    .success {
      display: block !important;
      background: #d1fae5;
      color: #065f46;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
    }

    .login-link a {
      color: #7b2cbf;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Create Account</h1>
    <p class="subtitle">Register for your WrapIt account</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      />

      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter a password"
        minlength="6"
        required
      />

      <button type="submit" id="registerButton">
        Register
      </button>
    </form>

    <div id="message"></div>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Log in</a>
    </p>
  </main>

  <script>
    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    registerForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;

      message.className = "";
      message.textContent = "";

      if (!name || !email || !phone || !password) {
        message.textContent = "Please complete all fields.";
        message.className = "error";
        return;
      }

      registerButton.disabled = true;
      registerButton.textContent = "Registering...";

      try {
        const response = await fetch(
          "https://wrapit-backend-salar.onrender.com/api/auth/register",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name: name,
              email: email,
              phone: phone,
              password: password
            })
          }
        );

        let data;

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            `Registration failed. Server status: ${response.status}`
          );
        }

        message.textContent =
          "Registration successful. You can now log in.";
        message.className = "success";

        registerForm.reset();

        setTimeout(function () {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {
        console.error("Registration error:", error);

        message.textContent =
          error.message || "Registration failed. Please try again.";
        message.className = "error";

      } finally {
        registerButton.disabled = false;
        registerButton.textContent = "Register";
      }
    });
  </script>
</body>
</html>
